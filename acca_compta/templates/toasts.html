<div class="toast-container position-fixed top-0 end-0 p-3"
     id="toasts"
     hx-swap-oob="afterbegin">
  {% for message in messages %}
    <div class="toast align-items-center border-0 {% if message.tags == 'success' %} bg-success text-white {% elif message.tags == 'warning' %} bg-warning text-black {% elif message.tags == 'error' or message.tags == 'danger' %} bg-danger text-white {% else %} bg-secondary {% endif %}"
         role="alert"
         aria-live="assertive"
         aria-atomic="true"
         style="font-size: 1rem"
         {% if message.tags == 'success' %}data-bs-autohide="true" {% else %}data-bs-autohide="false" {% endif %}>
      <div class="d-flex">
        <div class="toast-body">{{ message.message }}</div>
        <button type="button"
                class="btn-close {% if message.tags == 'warning' %}btn-close-black{% else %}btn-close-white{% endif %} me-2 m-auto"
                data-bs-dismiss="toast"
                aria-label="Close"></button>
      </div>
    </div>
  {% endfor %}
</div>
